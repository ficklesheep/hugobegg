<!-- Auto-resize helper + safe render handler -->
<script>
// attempt to render Cusdis when available, with retries
function renderCusdisNow() {
const el = document.getElementById('cusdis_thread');
if (!el) return;

// call when CUSDIS object becomes available
if (window.CUSDIS && typeof window.CUSDIS.renderTo === 'function') {
try {
window.CUSDIS.renderTo(el);
// attempt immediate resize after render
setTimeout(resizeCusdis, 300);
} catch (e) {
// ignore
console.warn('CUSDIS.renderTo error', e);
}
} else {
// retry shortly until script loads
setTimeout(renderCusdisNow, 250);
}
}

// Resize iframe by reading its document body height.
function resizeCusdis() {
const iframe = document.querySelector('#cusdis_thread iframe');
if (!iframe) return;
try {
const doc = iframe.contentDocument || iframe.contentWindow.document;
if (!doc || !doc.body) return;
const h = doc.body.scrollHeight;
if (h && iframe.style.height !== h + 'px') {
iframe.style.height = h + 'px';
}
} catch (e) {
// cross-origin — ignore
}
}

// periodic safety net for resizing (only while page open)
const _cusdisResizeInterval = setInterval(resizeCusdis, 1000);
window.addEventListener('load', function() {
setTimeout(resizeCusdis, 500);
});

// Optional: also listen for messages from Cusdis (they sometimes post resize messages)
window.addEventListener('message', function (event) {
if (event && event.data && event.data.from === 'cusdis' && event.data.type === 'resize') {
resizeCusdis();
}
});
</script>

<script>
/* Main posts loader & UI logic */
let postsData = [];

fetch('/public/posts.json')
.then(response => response.json())
.then(posts => {
posts.sort((a, b) => new Date(b.date) - new Date(a.date));
postsData = posts;
const grid = document.getElementById('blog-grid');

posts.forEach((post, index) => {
const card = document.createElement('div');
card.className = 'post-card';

const img = document.createElement('img');
img.className = 'post-card-image';
if (post.image) {
img.src = (post.image.startsWith('http') || post.image.startsWith('/')) ? post.image: '/static/bloguploads/' + post.image;
img.alt = post.title + ' cover image';
} else {
img.src = '/static/bloguploads/placeholder.jpg';
img.alt = 'No image available';
}
card.appendChild(img);

const body = document.createElement('div');
body.className = 'post-card-body';

const title = document.createElement('div');
title.className = 'post-card-title';
title.textContent = post.title;

const date = new Date(post.date || '');
const dateEl = document.createElement('div');
dateEl.className = 'post-card-date';
dateEl.textContent = isNaN(date) ? '': date.toLocaleDateString();

const description = document.createElement('div');
description.className = 'post-card-desc';
description.textContent = post.description || '';

body.appendChild(title);
body.appendChild(dateEl);
body.appendChild(description);

card.appendChild(body);

body.style.cursor = 'pointer';
body.addEventListener('click', () => showPost(index));

grid.appendChild(card);
});
})
.catch(err => console.error('posts.json load error',
err));

function showPost(index) {
const post = postsData[index];
if (!post) return;

document.getElementById('post-title').textContent = post.title || '';
document.getElementById('post-description').textContent = post.description || '';

const date = new Date(post.date || '');
document.getElementById('post-date').textContent = isNaN(date) ? '': date.toLocaleDateString();

const imageEl = document.getElementById('post-image');
if (post.image) {
imageEl.src = (post.image.startsWith('http') || post.image.startsWith('/')) ? post.image: '/static/bloguploads/' + post.image;
imageEl.alt = post.title + ' image';
} else {
imageEl.src = '';
imageEl.alt = '';
}

document.getElementById('post-content').innerHTML = post.content || '';

// Update Cusdis dataset attributes (use slug if available or fallback to title)
const cusdisThread = document.getElementById('cusdis_thread');
const pageId = post.slug ? String(post.slug): String(post.title || 'post-' + index);
cusdisThread.dataset.pageId = pageId;
cusdisThread.dataset.pageUrl = window.location.origin + '/blog/' + encodeURIComponent(pageId);
cusdisThread.dataset.pageTitle = post.title || '';

// Render Cusdis (retries until widget loaded)
renderCusdisNow();

// show post view
document.getElementById('blog-grid').style.display = 'none';
document.getElementById('blog-content').style.display = 'block';

// try to resize after a short delay
setTimeout(resizeCusdis, 600);
}

// back button
document.getElementById('back-button').addEventListener('click', () => {
document.getElementById('blog-content').style.display = 'none';
document.getElementById('blog-grid').style.display = 'grid';
});
</script>
