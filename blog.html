<!-- === REPLACE ENTIRE CUSDIS SECTION WITH THIS BLOCK === -->
<div id="cusdis_thread"
     data-host="https://cusdis.com"
     data-app-id="2a79b9af-88d1-405c-a8f2-29b2650d0567"
     data-page-id=""
     data-page-url=""

     data-lang="en"></div>

<script>
/* ===== 1) set locale BEFORE loading the widget ===== */
window.CUSDIS_LOCALE = {
  en: {
    powered_by: '',
    post_comment: 'Send Comment',
    loading: 'Loading comments...',
    email: 'Your Email (optional)',
    nickname: 'Your Name',
    reply_placeholder: 'Write a reply...',
    comment_placeholder: 'Write your comment...',
    submit: 'Post Comment',
    cancel: 'Cancel'
  }
};
window.CUSDIS_LANG = 'en';

/* ===== 2) helper: remove any existing cusdis script/iframe (avoid duplicates/cached iframe) ===== */
function purgeOldCusdis() {
  // remove previously injected cusdis script tags
  document.querySelectorAll('script[data-cusdis]').forEach(s => s.remove());
  // remove any existing iframe inside #cusdis_thread
  const el = document.getElementById('cusdis_thread');
  if (el) {
    const iframe = el.querySelector('iframe');
    if (iframe) iframe.remove();
  }
}

/* ===== 3) load cusdis script (cache-busted) and return a Promise when ready ===== */
function loadCusdisScript() {
  return new Promise((resolve, reject) => {
    purgeOldCusdis();
    // create script
    const s = document.createElement('script');
    s.setAttribute('data-cusdis', 'true');
    s.async = true;
    s.defer = true;
    s.src = 'https://cusdis.com/js/cusdis.es.js?v=' + Date.now();
    s.onload = () => resolve();
    s.onerror = (e) => reject(e);
    document.head.appendChild(s);
  });
}

/* ===== 4) render function used by your showPost() — updates thread attributes then renders ===== */
async function renderCusdisNow() {
  try {
    // ensure script loaded (reloads fresh each call to avoid cached iframe issues)
    await loadCusdisScript();

    const container = document.getElementById('cusdis_thread');
    if (!container) return;
    // If CUSDIS API exists, use it; otherwise fallback to global render if available
    if (window.CUSDIS && typeof window.CUSDIS.renderTo === 'function') {
      window.CUSDIS.renderTo(container);
    } else if (typeof window.renderCusdis === 'function') {
      window.renderCusdis(); // older helpers
    } else if (typeof window.CUSDIS === 'object') {
      // last resort: attempt renderTo after small delay
      setTimeout(() => {
        if (window.CUSDIS && typeof window.CUSDIS.renderTo === 'function') window.CUSDIS.renderTo(container);
      }, 300);
    } else {
      // keep retrying a few times until the SDK defines the API
      let tries = 0;
      const t = setInterval(() => {
        tries++;
        if (window.CUSDIS && typeof window.CUSDIS.renderTo === 'function') {
          clearInterval(t);
          window.CUSDIS.renderTo(container);
        } else if (tries > 10) {
          clearInterval(t);
          console.warn('Cusdis: render API not available after retries');
        }
      }, 300);
    }
    // small delay then resize
    setTimeout(resizeCusdis, 500);
  } catch (err) {
    console.error('Failed to load Cusdis script', err);
  }
}

/* ===== 5) auto-resize function (keeps the iframe height in sync) ===== */
function resizeCusdis() {
  const iframe = document.querySelector('#cusdis_thread iframe');
  if (!iframe) return;
  try {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    if (!doc || !doc.body) return;
    const h = doc.body.scrollHeight;
    if (h && iframe.style.height !== h + 'px') iframe.style.height = h + 'px';
  } catch (e) {
    // cross-origin protections may throw; ignore if so
  }
}

/* periodic safety net */
const __cusdisResizeInterval = setInterval(resizeCusdis, 1000);
window.addEventListener('load', resizeCusdis);

/* expose helper globally (so your showPost() can call renderCusdisNow()) */
window.renderCusdisNow = renderCusdisNow;
window.resizeCusdis = resizeCusdis;
</script>

<script>
/* Main posts loader & UI logic */
let postsData = [];

fetch('/public/posts.json')
.then(response => response.json())
.then(posts => {
posts.sort((a, b) => new Date(b.date) - new Date(a.date));
postsData = posts;
const grid = document.getElementById('blog-grid');

posts.forEach((post, index) => {
const card = document.createElement('div');
card.className = 'post-card';

const img = document.createElement('img');
img.className = 'post-card-image';
if (post.image) {
img.src = (post.image.startsWith('http') || post.image.startsWith('/')) ? post.image: '/static/bloguploads/' + post.image;
img.alt = post.title + ' cover image';
} else {
img.src = '/static/bloguploads/placeholder.jpg';
img.alt = 'No image available';
}
card.appendChild(img);

const body = document.createElement('div');
body.className = 'post-card-body';

const title = document.createElement('div');
title.className = 'post-card-title';
title.textContent = post.title;

const date = new Date(post.date || '');
const dateEl = document.createElement('div');
dateEl.className = 'post-card-date';
dateEl.textContent = isNaN(date) ? '': date.toLocaleDateString();

const description = document.createElement('div');
description.className = 'post-card-desc';
description.textContent = post.description || '';

body.appendChild(title);
body.appendChild(dateEl);
body.appendChild(description);

card.appendChild(body);

body.style.cursor = 'pointer';
body.addEventListener('click', () => showPost(index));

grid.appendChild(card);
});
})
.catch(err => console.error('posts.json load error',
err));

function showPost(index) {
const post = postsData[index];
if (!post) return;

document.getElementById('post-title').textContent = post.title || '';
document.getElementById('post-description').textContent = post.description || '';

const date = new Date(post.date || '');
document.getElementById('post-date').textContent = isNaN(date) ? '': date.toLocaleDateString();

const imageEl = document.getElementById('post-image');
if (post.image) {
imageEl.src = (post.image.startsWith('http') || post.image.startsWith('/')) ? post.image: '/static/bloguploads/' + post.image;
imageEl.alt = post.title + ' image';
} else {
imageEl.src = '';
imageEl.alt = '';
}

document.getElementById('post-content').innerHTML = post.content || '';

// Update Cusdis dataset attributes (use slug if available or fallback to title)
const cusdisThread = document.getElementById('cusdis_thread');
const pageId = post.slug ? String(post.slug): String(post.title || 'post-' + index);
cusdisThread.dataset.pageId = pageId;
cusdisThread.dataset.pageUrl = window.location.origin + '/blog/' + encodeURIComponent(pageId);
cusdisThread.dataset.pageTitle = post.title || '';

// Render Cusdis (retries until widget loaded)
renderCusdisNow();

// show post view
document.getElementById('blog-grid').style.display = 'none';
document.getElementById('blog-content').style.display = 'block';

// try to resize after a short delay
setTimeout(resizeCusdis, 600);
}

// back button
document.getElementById('back-button').addEventListener('click', () => {
document.getElementById('blog-content').style.display = 'none';
document.getElementById('blog-grid').style.display = 'grid';
});
</script>
