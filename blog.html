<script>
/* Remove Cusdis scrollbar: force iframe to expand and remove fixed heights */
(function() {
  const FIX_STYLE = {
    height: 'auto',
    minHeight: '400px',     // adjust if you want smaller/larger initial height
    maxHeight: 'none',
    overflow: 'visible',
    border: 'none',
  };

  function styleIframe(iframe) {
    try {
      // remove inline height attribute and force styles on the iframe element
      iframe.removeAttribute('height');
      Object.assign(iframe.style, FIX_STYLE);
      // also remove any !important inline style if present by overriding via cssText
      iframe.style.cssText += ';height:auto !important; max-height:none !important; overflow:visible !important;';
    } catch (e) {
      // cross-origin access not needed here — we only set parent iframe element styles
      console.warn('cusdis iframe style attempt:', e);
    }
  }

  function applyToAll() {
    const iframes = document.querySelectorAll('iframe[src*="cusdis.com"], iframe[src*="cusdis"]');
    iframes.forEach(styleIframe);
  }

  // Run once after a short delay (give Cusdis time to inject)
  setTimeout(applyToAll, 500);

  // Also run again after 2s and 5s in case it injects slower
  setTimeout(applyToAll, 2000);
  setTimeout(applyToAll, 5000);

  // MutationObserver: watch the document for newly added iframes and style them immediately
  const mo = new MutationObserver((mutations) => {
    for (const m of mutations) {
      if (!m.addedNodes) continue;
      for (const node of m.addedNodes) {
        if (node.tagName === 'IFRAME' && node.src && node.src.includes('cusdis')) {
          styleIframe(node);
        }
        // also if a subtree is added that contains an iframe
        if (node.querySelectorAll) {
          const found = node.querySelectorAll('iframe[src*="cusdis.com"], iframe[src*="cusdis"]');
          found.forEach(styleIframe);
        }
      }
    }
  });
  mo.observe(document.documentElement || document.body, { childList: true, subtree: true });

  // As a last-resort periodic fixer for the first 10 seconds (handles race conditions)
  let tries = 0;
  const interval = setInterval(() => {
    applyToAll();
    tries++;
    if (tries > 10) clearInterval(interval);
  }, 1000);
})();
</script>

<script>
let postsData = [];

fetch('/public/posts.json')
.then(response => response.json())
.then(posts => {

posts.sort((a, b) => new Date(b.date) - new Date(a.date));
postsData = posts;
const grid = document.getElementById('blog-grid');

posts.forEach((post, index) => {
const card = document.createElement('div');
card.className = 'post-card';

// Cover image if available
const img = document.createElement('img');
img.className = 'post-card-image';
if (post.image) {
if (!post.image.startsWith('http') && !post.image.startsWith('/')) {
img.src = '/static/bloguploads/' + post.image;
} else {
img.src = post.image;
}
img.alt = post.title + " cover image";
} else {
img.src = '/static/bloguploads/placeholder.jpg';
img.alt = 'No image available';
}
card.appendChild(img);

const body = document.createElement('div');
body.className = 'post-card-body';

const title = document.createElement('div');
title.className = 'post-card-title';
title.textContent = post.title;

const date = new Date(post.date);
const dateEl = document.createElement('div');
dateEl.className = 'post-card-date';
dateEl.textContent = isNaN(date) ? '': date.toLocaleDateString();

const description = document.createElement('div');
description.className = 'post-card-desc';
description.textContent = post.description || '';


body.appendChild(title);
body.appendChild(dateEl);
body.appendChild(description);

card.appendChild(body);

// Make the entire body clickable (including title and description)
body.style.cursor = 'pointer';
body.addEventListener('click', () => showPost(index));

grid.appendChild(card);
});


});

function showPost(index) {
const post = postsData[index];


document.getElementById('post-title').textContent = post.title;
document.getElementById('post-description').textContent = post.description || '';
const date = new Date(post.date);
document.getElementById('post-date').textContent = isNaN(date) ? '': date.toLocaleDateString();


const imageEl = document.getElementById('post-image');

console.log('post.image:', post.image);

// Adjust this depending on your post.image value
if (post.image) {
// If post.image is just a filename, prepend folder
if (!post.image.startsWith('http') && !post.image.startsWith('/')) {
imageEl.src = '/static/bloguploads/' + post.image;
} else {
imageEl.src = post.image;
}
imageEl.alt = post.title + ' image';
} else {
imageEl.src = '';
imageEl.alt = '';
}

document.getElementById('post-content').innerHTML = post.content || '';
// Update Cusdis comment section dynamically
const cusdisThread = document.getElementById('cusdis_thread');
cusdisThread.dataset.pageId = post.title;
cusdisThread.dataset.pageUrl = window.location.origin + '/blog/' + post.slug;
cusdisThread.dataset.pageTitle = post.title;

// Re-render Cusdis widget
if (window.CUSDIS) {
window.CUSDIS.renderTo(cusdisThread);
}

document.getElementById('blog-grid').style.display = 'none';
document.getElementById('blog-content').style.display = 'block';


}
document.getElementById('back-button').addEventListener('click', () => {
document.getElementById('blog-content').style.display = 'none';
document.getElementById('blog-grid').style.display = 'grid'; // or 'block' if you prefer
});

</script>
