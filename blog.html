<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hugo Begg Blog</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

    <header class="header__main">
   
        <div class="header__column--1">HUGO BEGG</div>
        <div class="header__column header__column--2">
            <div class="menu">
            <nav>
            
                    <div class="menu-btn ">
                    <div  class="menu-btn-burger "></div>
                    </div>

                 <ol >
                       <li style=" list-style-type: none; border-bottom: none; "><a href="/gallery/street.html">STREET</a></li>
                       <li style=" list-style-type: none; border-bottom: none;"><a href="/gallery/landscapes.html">LANDSCAPE</a></li>
                       <li style=" list-style-type: none; border-bottom: none;"><a href="/gallery/travel.html">TRAVEL</a></li>
                       <li style=" list-style-type: none; border-bottom: none; "><a href="/gallery/film.html">FILM</a></li>
                       <li style=" list-style-type: none; border-bottom: none;"><a href="about.html">ABOUT</a></li>


                        
                 </ol>
             </nav>
            </div>
            
        </div>
        <div class="header__column--3"><a href="https://www.instagram.com/hugobegg/ "><img style="width: 20px;"src="/images/instagram.png " alt=" "></a></div>
    </header>

  <main class="blog-container">

    <!-- Blog post grid -->
    <div id="blog-grid" class="blog-grid"></div>

    <!-- Blog content area -->
    <div id="blog-content" class="blog-content" style="display: none;">
      <button id="back-button">← Back to posts</button>
      <img id="post-image" class="post-image" />
      <h2 class="post-title" id="post-title"></h2>
      <p class="post-date" id="post-date"></p>
      <div class="line"></div>
      <div class="post-content" id="post-content"></div>
    </div>
  </main>

  
<div id="footer-placeholder"></div>

<script>
  fetch('/footer.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
    });
</script>

  <script>
    let postsData = [];

    fetch('/public/posts.json')
      .then(response => response.json())
      .then(posts => {
        
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));
        postsData = posts;
        const grid = document.getElementById('blog-grid');

        posts.forEach((post, index) => {
  const card = document.createElement('div');
  card.className = 'post-card';

  // Cover image if available
  const img = document.createElement('img');
img.className = 'post-card-image';

if (post.image) {
  if (!post.image.startsWith('http') && !post.image.startsWith('/')) {
    img.src = '/static/bloguploads/' + post.image;
  } else {
    img.src = post.image;
  }
  img.alt = post.title + " cover image";
} else {
  // No image found, use a placeholder or leave empty
  img.src = '/static/bloguploads/placeholder.jpg';  // <-- optional placeholder image path
  img.alt = 'No image available';
}

card.appendChild(img);


  const body = document.createElement('div');
  body.className = 'post-card-body';

  const title = document.createElement('div');
  title.className = 'post-card-title';
  title.textContent = post.title;

  const date = new Date(post.date);
  const dateEl = document.createElement('div');
  dateEl.className = 'post-card-date';
  dateEl.textContent = isNaN(date) ? '' : date.toLocaleDateString();

  const description = document.createElement('div');
  description.className = 'post-card-desc';
  description.textContent = post.description || '';  // Fallback to empty if not provided

  const btn = document.createElement('button');
  btn.className = 'read-more-btn';
  btn.textContent = 'Read more';
  btn.addEventListener('click', () => showPost(index));

  body.appendChild(title);
  body.appendChild(dateEl);
  body.appendChild(description);
  body.appendChild(btn);

  card.appendChild(body);
  grid.appendChild(card);
});

      });

    function showPost(index) {
  const post = postsData[index];
  const imageEl = document.getElementById('post-image');

  console.log('post.image:', post.image);

  // Adjust this depending on your post.image value
  if (post.image) {
    // If post.image is just a filename, prepend folder
    if (!post.image.startsWith('http') && !post.image.startsWith('/')) {
      imageEl.src = '/static/bloguploads/' + post.image;
    } else {
      imageEl.src = post.image;
    }
    imageEl.alt = post.title + ' image';
  } else {
    imageEl.src = '';
    imageEl.alt = '';
  }

  document.getElementById('post-title').textContent = post.title;

  const date = new Date(post.date);
  document.getElementById('post-date').textContent = isNaN(date) ? '' : date.toLocaleDateString();

  document.getElementById('post-content').innerHTML = post.content || '';


  document.getElementById('blog-grid').style.display = 'none';
  document.getElementById('blog-content').style.display = 'block';
  
  
}
document.getElementById('back-button').addEventListener('click', () => {
  document.getElementById('blog-content').style.display = 'none';
  document.getElementById('blog-grid').style.display = 'grid'; // or 'block' if you prefer
});

  </script>
<div id="footer-placeholder"></div>

<script>
  fetch('/footer.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
    });
</script>
</body>
</html>
