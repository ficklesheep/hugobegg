backend:
  name: git-gateway
  repo: ficklesheep/hugobegg
  branch: master
  site_domain: modest-wing-e14976.netlify.app

media_folder: "static/bloguploads"
public_folder: "/bloguploads"

media_library:
  name: local
  config:
    media_folder: "static/bloguploads"
    public_folder: "/bloguploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Main content of the post (you can insert images inline here)"
