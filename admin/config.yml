backend:
  name: git-gateway
  repo: ficklesheep/hugobegg
  branch: master
  site_domain: modest-wing-e14976.netlify.app

media_folder: "images/bloguploads"   # where images are stored in your repo
public_folder: "images/bloguploads"        # how they appear in your site URLs

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Optional cover image for this post" }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Main content (use the image button to insert photos inline)"