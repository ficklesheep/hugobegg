backend:
  name: git-gateway
  repo: ficklesheep/hugobegg
  branch: master
  site_domain: modest-wing-e14976.netlify.app

media_folder: "images/bloguploads"   # stored in repo
public_folder: "/images/bloguploads" # public URL path (note leading slash!)

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Optional cover image for this post" }

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Main content (use the image button to insert photos inline)"

      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Optional gallery block with flexible layouts"
        fields:
          - { label: "Image", name: "img", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - label: "Layout"
            name: "layout"
            widget: "select"
            options: ["single", "side-by-side", "three", "full-bleed"]
            default: "single"
