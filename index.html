    <div id="header-placeholder"></div>
<script>
  function initMobileMenu() {
    const menuBtn = document.querySelector('.menu-btn');
    const menu = document.querySelector('.menu');

    if (menuBtn && menu) {
      menuBtn.addEventListener('click', function () {
        this.classList.toggle('open');           // animate burger
        menu.classList.toggle('open');           // show/hide menu
      });
    } else {
      console.warn('menu or menu-btn not found');
    }
  }

  fetch('/header.html')
    .then(res => res.text())
    .then(data => {
      const placeholder = document.getElementById('header-placeholder');
      const temp = document.createElement('div');
      temp.innerHTML = data;

      const fragment = document.createDocumentFragment();
      while (temp.firstChild) {
        fragment.appendChild(temp.firstChild);
      }

      placeholder.replaceWith(fragment);

      // ✅ Hide "HOME" if on homepage
      const currentPath = window.location.pathname.replace(/\/$/, '');
      const isHome = currentPath === '' || currentPath === '/index' || currentPath === '/index.html';
      const homeNavItem = document.getElementById('nav-home');
      if (isHome && homeNavItem) {
        homeNavItem.style.display = 'none';
      }

      // ✅ Init menu after loading header
      initMobileMenu();
    });
</script>

    <main class="main main--index">

 <div class="cover-container cover-container--1"></div>
<div class="cover-container cover-container--2"></div>

    <div class="cover-text" id="cover-text"></div>
  <div class="nav-buttons">
    <button id="prev-btn">‹</button>
    <button id="next-btn">›</button>
  
     </div>
    
      
    </main>
<script>
  const containers = document.querySelectorAll('.cover-container');
  const textElement = document.getElementById('cover-text');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  let index = 0;
  let activeIndex = 0;
  let intervalId;
  let coverFiles = [];

  // Extract location and year for caption
  function extractLocationAndYear(fileName) {
    // Match viewpor C_<location>--<country>--YYYY-MM-DD_xxxx.webp
    const match = fileName.match(/^C_(.+)--(\d{4})-\d{2}-\d{2}_\d+\.webp$/);
    if (!match) return null;

    const rawLocation = match[1].replace(/--/g, ', ').replace(/-/g, ' ');
    const year = match[2];
    return {
      location: rawLocation,
      year: year
    };
  }

  function showImage(i) {
    const nextIndex = 1 - activeIndex;
    const activeContainer = containers[activeIndex];
    const nextContainer = containers[nextIndex];
    const fileName = coverFiles[i];

    nextContainer.style.backgroundImage = `url('/gallery/images/carousel/${fileName}')`;
    nextContainer.classList.add('active');
    activeContainer.classList.remove('active');

    activeIndex = nextIndex;

    // Caption handling
    const info = extractLocationAndYear(fileName);
    textElement.style.opacity = 0;
    setTimeout(() => {
      textElement.textContent = info ? `${info.location.toUpperCase()} — ${info.year}` : "";
      textElement.style.opacity = 1;
    }, 300);
  }

  function changeBackground() {
    showImage(index);
    index = (index + 1) % coverFiles.length;
  }

  function prevImage() {
    index = (index - 2 + coverFiles.length) % coverFiles.length;
    changeBackground();
    resetInterval();
  }

  function nextImage() {
    changeBackground();
    resetInterval();
  }

  function resetInterval() {
    clearInterval(intervalId);
    intervalId = setInterval(changeBackground, 5000);
  }

  function preloadImages(images, callback) {
    let loaded = 0;
    images.forEach((src) => {
      const img = new Image();
      img.onload = () => {
        loaded++;
        if (loaded === images.length) callback();
      };
      img.src = `/gallery/images/carousel/${src}`;
    });
  }

  // Load covers dynamically
  function loadCovers() {
    $.ajax({
      url: '/gallery/images/carousel/filelist.txt',
      dataType: 'text',
      success: function(data) {
        coverFiles = data.split('\n').map(f => f.trim()).filter(f => f.length > 0);

        if (coverFiles.length === 0) return;

        preloadImages(coverFiles, () => {
          showImage(index);
          index = (index + 1) % coverFiles.length;
          intervalId = setInterval(changeBackground, 5000);
        });
      }
    });
  }

  // Set up buttons
  prevBtn.addEventListener('click', prevImage);
  nextBtn.addEventListener('click', nextImage);

  // Start
  document.addEventListener("DOMContentLoaded", loadCovers);
</script>



<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        const url = new URL(window.location.href);
        const token = url.hash.match(/invite_token=([^&]+)/);

        if (!user && token) {
          window.netlifyIdentity.open('login');
        }

        // Optional: redirect after login
        window.netlifyIdentity.on('login', () => {
          document.location.href = '/admin/';
        });
      });

      window.netlifyIdentity.init();
    }
  });
</script>
