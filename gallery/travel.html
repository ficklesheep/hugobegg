  <div id="header-placeholder"></div>
  <script>
    fetch('/header.html')
    .then(res => res.text())
    .then(data => {
      const placeholder = document.getElementById('header-placeholder');
      const temp = document.createElement('div');
      temp.innerHTML = data;

      const fragment = document.createDocumentFragment();
      while (temp.firstChild) {
        fragment.appendChild(temp.firstChild);
      }

      placeholder.replaceWith(fragment);

      // Move this code *after* the header has been inserted
      const pageNames = {
        "/index": "HOME",
        "/gallery/street": "STREET",
        "/gallery/landscapes": "LANDSCAPES",
        // optional fallback
        "/gallery/travel": "TRAVEL",
        "/gallery/film": "FILM",
        "/about": "ABOUT"
      };

      const path = window.location.pathname;
      const pageName = pageNames[path] || "UNKNOWN";

      // Wait until the header is inserted before selecting elements from it
      const nameSpan = document.querySelector("#page-name");
      if (nameSpan) {
        nameSpan.innerHTML = '<strong style="font-size: 10px; padding-left: 4px;">/' + pageName + '</strong>';
      }

      // For debugging: just log to console (won’t be visible on mobile but won’t break page)
      console.log("Page name:", pageName);
    })
    .catch(error => {
      document.getElementById('header-placeholder').textContent = "Header load error: " + error;
    });
  </script>

  <!-- Put this in your <main> where you want the buttons -->
  <div class="gallery-sort">
    <button data-sort="shuffle" class="active">SHUFFLE</button>
    <button data-sort="newest">MOST RECENT</button>
    <button data-sort="oldest">OLDEST</button>
  </div>

  <ol class="gallery__thumbnails"></ol>
  <div id="gallery-lightboxes" class="gallery-lightboxes"></div>

  <script>
    const olContainer = document.querySelector(".gallery__thumbnails");
    const lightboxContainer = document.getElementById("gallery-lightboxes");

    // Get image number (for lightbox anchors)
    function getImageNumberFromFileName(fileName) {
      const match = fileName.match(/_(\d+)\.jpg$/);
      return match ? match[1]: null;
    }

    // Extract date as integer YYYYMMDD from filename like T_location--country--YYYYMMDD_xxxx.jpg
    function getDateFromFileName(fileName) {
      // Match --YYYY-MM-DD_ pattern
      const match = fileName.match(/--(\d{4})-(\d{2})-(\d{2})_/);
      if (!match) return 0;

      // Compose a comparable number YYYYMMDD for sorting
      return parseInt(match[1] + match[2] + match[3], 10);
    }


    // Shuffle an array in-place
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i],
          array[j]] = [array[j],
          array[i]];
      }
      return array;
    }

    // Clear gallery and lightboxes
    function clearGallery() {
      olContainer.innerHTML = '';
      lightboxContainer.innerHTML = '';
    }

    // Extract location and year for caption
    function extractLocationAndYear(fileName) {
      // Match T_<location>--<country>--YYYY-MM-DD_xxxx.jpg
      const match = fileName.match(/^T_(.+)--(\d{4})-\d{2}-\d{2}_\d+\.jpg$/);
      if (!match) return null;

      // match[1] = "San-Miguel--Mexico"
      // Replace double dashes with comma + space, single dashes with space
      const rawLocation = match[1].replace(/--/g, ', ').replace(/-/g, ' ');
      const year = match[2];
      return {
        location: rawLocation,
        year: year
      };
    }


    // Create gallery thumbnails rows
    function createGalleryRows(fileNames) {
      clearGallery();
      const screenNarrow = window.innerWidth < 900;
      const imagesPerRow = 4;

      for (let i = 0; i < fileNames.length; i += imagesPerRow) {
        const row = document.createElement("div");
        row.className = "thumbnail__row";

        const groupAItems = [];
        const groupBItems = [];

        for (let j = 0; j < imagesPerRow; j++) {
          const index = i + j;
          if (index >= fileNames.length) break;

          const fileName = fileNames[index].trim();
          const imageNumber = getImageNumberFromFileName(fileName);
          if (!fileName || !imageNumber) continue;

          const div = document.createElement("div");
          const isThumbnailA = j < 2;
          div.className = "thumbnail__item " + (isThumbnailA ? "thumbnail__A": "thumbnail__B");

          const imageSrc = `/gallery/images/travel_thumbnails/${fileName}`;
          const anchor = document.createElement("a");
          anchor.className = "thumbnail__link__overlay";
          anchor.href = `#travel_${imageNumber}`;

          const img = document.createElement("img");
          img.className = "thumbnail__item--img lazyload";
          img.setAttribute("data-src", imageSrc);
          img.alt = "";

          anchor.appendChild(img);
          div.appendChild(anchor);

          // Optional: set ratio CSS variable asynchronously if needed
          const imgTemp = new Image();
          imgTemp.onload = () => {
            div.style.setProperty("--ratio", `${imgTemp.width}/${imgTemp.height}`);
          };
          imgTemp.src = imageSrc;

          if (isThumbnailA) groupAItems.push(div);
          else groupBItems.push(div);
        }

        if (screenNarrow) {
          const groupAWrapper = document.createElement("div");
          groupAWrapper.className = "thumbnail__group thumbnail__group--A";
          groupAItems.forEach(el => groupAWrapper.appendChild(el));
          row.appendChild(groupAWrapper);

          const groupBWrapper = document.createElement("div");
          groupBWrapper.className = "thumbnail__group thumbnail__group--B";
          groupBItems.forEach(el => groupBWrapper.appendChild(el));
          row.appendChild(groupBWrapper);
        } else {
          groupAItems.forEach(el => row.appendChild(el));
          groupBItems.forEach(el => row.appendChild(el));
        }

        olContainer.appendChild(row);
      }
    }

    // Create lightbox elements for full images
    function createLightboxElements(fileNames) {
      lightboxContainer.innerHTML = "";
      fileNames.forEach(fileName => {
        const info = extractLocationAndYear(fileName);
        const numMatch = fileName.match(/_(\d+)\.jpg$/);
        if (!numMatch) return;

        const number = numMatch[1];
        const fullSizeSrc = `/gallery/images/travel_fullsize/${fileName}`;

        const lightbox = document.createElement("div");
        lightbox.className = "gallery-lightbox";
        lightbox.id = `travel_${number}`;

        const anchor = document.createElement("a");
        anchor.href = "#!";
        anchor.innerHTML = `<div class="close-button-container"><div class="close-button-icon"></div></div>`;

        const img = document.createElement("img");
        img.className = "gallery-lightbox-image lazyload";
        img.style.pointerEvents = "none";
        img.setAttribute("data-src", fullSizeSrc);
        img.alt = "";

        lightbox.appendChild(anchor);
        lightbox.appendChild(img);

        if (info) {
          const caption = document.createElement("p");
          caption.className = "lightbox-caption";
          caption.textContent = `${info.location.toUpperCase()} — ${info.year}`;
          lightbox.appendChild(caption);
        }

        lightboxContainer.appendChild(lightbox);
      });
    }

    // Load gallery with selected sort mode
    function loadGallery(sortMode = 'shuffle') {
      $.ajax({
        url: '/gallery/images/travel_fullsize/filelist.txt',
        dataType: 'text',
        success: function(data) {
          let fileNames = data.split('\n').map(f => f.trim()).filter(f => f.length > 0);

          if (sortMode === 'shuffle') {
            fileNames = shuffleArray(fileNames);
          } else if (sortMode === 'newest') {
            fileNames.sort((a, b) => getDateFromFileName(b) - getDateFromFileName(a));
          } else if (sortMode === 'oldest') {
            fileNames.sort((a, b) => getDateFromFileName(a) - getDateFromFileName(b));
          }

          createGalleryRows(fileNames);
          createLightboxElements(fileNames);
        }
      });
    }

    // Setup buttons and event listeners
    document.addEventListener("DOMContentLoaded", () => {
      const buttons = document.querySelectorAll('.gallery-sort button');

      buttons.forEach(button => {
        button.addEventListener('click', () => {
          // Remove active from all buttons
          buttons.forEach(b => b.classList.remove('active'));
          // Add active to clicked
          button.classList.add('active');

          loadGallery(button.dataset.sort);
        });
      });

      // Initial load with shuffle
      loadGallery('shuffle');
    });

    // Reload gallery only on screen width breakpoint change
    let resizeTimeout;
    let lastIsNarrow = window.innerWidth < 900;

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        const isNarrow = window.innerWidth < 900;
        if (isNarrow !== lastIsNarrow) {
          lastIsNarrow = isNarrow;
          // reload with currently active sort button or shuffle if none
          const activeBtn = document.querySelector('.gallery-sort button.active');
          loadGallery(activeBtn ? activeBtn.dataset.sort: 'shuffle');
        }
      },
        200);
    });
  </script>

  <style>

      font-weight: 500;
    }
  </style>
