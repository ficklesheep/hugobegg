<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Viewer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .img-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 10px;
      width: 100vw;
      position: relative;
      left: 50%;
      right: 50%;
      margin-left: -50vw;
      margin-right: -50vw;
      padding: 0 4vw;
      box-sizing: border-box;
    }

    .img-row > figure,
    .img-row > img {
      width: 48%;
      margin: 0;
      border-radius: 8px;
      overflow: hidden;
    }

    .img-row img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 8px;
    }

    .img-row figcaption {
      text-align: center;
      font-size: 0.9em;
      color: #666;
      margin-top: 4px;
    }

    @media (max-width: 800px) {
      .img-row {
        flex-wrap: wrap;
        width: 100%;
        position: static;
        margin: 0 auto;
        padding: 0;
      }

      .img-row > figure,
      .img-row > img {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <article id="post-content"></article>

  <script>
    const post = {
      // Simulate content loaded from Markdown or CMS:
      content: `
This is a paragraph before the images.

![Alt 1](image1.jpg "Caption 1")
![Alt 2](image2.jpg)

Another paragraph after.
`
    };

    function showPost() {
      const contentEl = document.getElementById('post-content');

      // Convert newlines into paragraphs if there are no <p> tags
      const lines = post.content.trim().split(/\n{2,}/);
      const htmlWithParagraphs = lines.map(line => {
        if (line.trim().startsWith('<')) return line;
        return '<p>' + line.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');

      contentEl.innerHTML = htmlWithParagraphs;

      // --- Step 1: Wrap images with captions ---
      const imgsWithTitles = contentEl.querySelectorAll('img[title]');
      imgsWithTitles.forEach(img => {
        if (img.parentElement.tagName.toLowerCase() === 'figure') return;

        const fig = document.createElement('figure');
        img.replaceWith(fig);
        fig.appendChild(img);

        const caption = document.createElement('figcaption');
        caption.textContent = img.getAttribute('title');
        fig.appendChild(caption);
      });

      // --- Step 2: Group adjacent images or figures into .img-row ---
      const paragraphs = contentEl.querySelectorAll('p');
      let currentRow = [];

      paragraphs.forEach(p => {
        const imgs = p.querySelectorAll('img, figure');
        if (imgs.length === 1 && p.childNodes.length === 1) {
          currentRow.push(p);
        } else {
          if (currentRow.length > 1) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'img-row';
            currentRow.forEach(imgP => {
              const el = imgP.querySelector('img, figure');
              if (el) rowDiv.appendChild(el);
            });
            currentRow[0].parentNode.insertBefore(rowDiv, currentRow[0]);
            currentRow.forEach(imgP => imgP.remove());
          }
          currentRow = [];
        }
      });

      if (currentRow.length > 1) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'img-row';
        currentRow.forEach(imgP => {
          const el = imgP.querySelector('img, figure');
          if (el) rowDiv.appendChild(el);
        });
        currentRow[0].parentNode.insertBefore(rowDiv, currentRow[0]);
        currentRow.forEach(imgP => imgP.remove());
      }
    }

    document.addEventListener('DOMContentLoaded', showPost);
  </script>
</body>
</html>
