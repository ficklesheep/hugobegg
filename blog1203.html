<div id="cusdis_thread"
data-host="https://cusdis.com"

<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>

<script>
function renderCusdisNow() {
const el = document.getElementById('cusdis_thread');
if (!el) return;

if (window.CUSDIS && typeof window.CUSDIS.renderTo === 'function') {
try {
window.CUSDIS.renderTo(el);
setTimeout(resizeCusdis, 300);
} catch (e) {
console.warn('CUSDIS.renderTo error', e);
}
} else {
setTimeout(renderCusdisNow, 250);
}
}

function resizeCusdis() {
const iframe = document.querySelector('#cusdis_thread iframe');
if (!iframe) return;
try {
const doc = iframe.contentDocument || iframe.contentWindow.document;
if (!doc || !doc.body) return;
const h = doc.body.scrollHeight;
if (h && iframe.style.height !== h + 'px') {
iframe.style.height = h + 'px';
}
} catch (e) {}
}

const _cusdisResizeInterval = setInterval(resizeCusdis, 1000);
window.addEventListener('load', () => setTimeout(resizeCusdis, 500));
window.addEventListener('message', e => {
if (e?.data?.from === 'cusdis' && e.data.type === 'resize') resizeCusdis();
});
</script>

<script>
let postsData = [];

fetch('/public/posts.json')
.then(response => response.json())
.then(posts => {
posts.sort((a, b) => new Date(b.date) - new Date(a.date));
postsData = posts;
const grid = document.getElementById('blog-grid');

posts.forEach((post, index) => {
const card = document.createElement('div');
card.className = 'post-card';

const img = document.createElement('img');
img.className = 'post-card-image';
if (post.image) {
img.src = (post.image.startsWith('http') || post.image.startsWith('/'))
? post.image: '/images/bloguploads/' + post.image;
img.alt = post.title + ' cover image';
} else {
img.src = '/images/bloguploads/placeholder.jpg';
img.alt = 'No image available';
}
card.appendChild(img);

const body = document.createElement('div');
body.className = 'post-card-body';

const title = document.createElement('div');
title.className = 'post-card-title';
title.textContent = post.title;

const date = new Date(post.date || '');
const dateEl = document.createElement('div');
dateEl.className = 'post-card-date';
dateEl.textContent = isNaN(date) ? '': date.toLocaleDateString();

const description = document.createElement('div');
description.className = 'post-card-desc';
description.textContent = post.description || '';

body.appendChild(title);
body.appendChild(dateEl);
body.appendChild(description);

card.appendChild(body);

body.style.cursor = 'pointer';
body.addEventListener('click', () => showPost(index));

grid.appendChild(card);
});
})
.catch(err => console.error('posts.json load error', err));
function wrapConsecutiveImages() {
  const contentEl = document.getElementById('post-content');
  const paragraphs = Array.from(contentEl.querySelectorAll('p'));
  let imgGroup = [];

  paragraphs.forEach(p => {
    // Check if the <p> contains only images (and whitespace)
    const imgs = Array.from(p.children).filter(el => el.tagName.toLowerCase() === 'img');
    const hasOnlyImages = imgs.length > 0 && p.textContent.trim() === '';

    if (hasOnlyImages) {
      imgGroup.push(p);
    } else {
      // Flush the current group if it has 2 or more consecutive image <p>s
      if (imgGroup.length >= 2) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'img-row';
        imgGroup.forEach(pg => {
          const images = pg.querySelectorAll('img');
          images.forEach(img => rowDiv.appendChild(img));
          pg.remove();
        });
        imgGroup = [];
        // Insert rowDiv before the first <p> of the group
        p.parentNode.insertBefore(rowDiv, p);
      } else {
        imgGroup = [];
      }
    }
  });

  // Flush at the end if needed
  if (imgGroup.length >= 2) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'img-row';
    imgGroup.forEach(pg => {
      const images = pg.querySelectorAll('img');
      images.forEach(img => rowDiv.appendChild(img));
      pg.remove();
    });
    imgGroup[0].parentNode.insertBefore(rowDiv, imgGroup[0]);
  }
}


function showPost(index) {
  const post = postsData[index];
  if (!post) return;

  document.getElementById('post-title').textContent = post.title || '';
  document.getElementById('post-description').textContent = post.description || '';

  const date = new Date(post.date || '');
  document.getElementById('post-date').textContent = isNaN(date) ? '' : date.toLocaleDateString();

  const imageEl = document.getElementById('post-image');
  if (post.image) {
    imageEl.src = (post.image.startsWith('http') || post.image.startsWith('/'))
      ? post.image
      : '/images/bloguploads/' + post.image;
    imageEl.alt = post.title + ' image';
  } else {
    imageEl.src = '';
    imageEl.alt = '';
  }

  const contentEl = document.getElementById('post-content');
  contentEl.innerHTML = post.content || '';
  contentEl.innerHTML = contentEl.innerHTML.replace(/<break>/g, '<p></p>');


wrapConsecutiveImages();
  // COMMENT OUT IMAGE WRAPPING FOR NOW
  // const imgsWithTitles = contentEl.querySelectorAll('img[title]');
  // ... all wrapping logic ...

  const cusdisThread = document.getElementById('cusdis_thread');
  const pageId = post.slug ? String(post.slug) : String(post.title || 'post-' + index);
  cusdisThread.dataset.pageId = pageId;
  cusdisThread.dataset.pageUrl = window.location.origin + '/blog/' + encodeURIComponent(pageId);
  cusdisThread.dataset.pageTitle = post.title || '';

  renderCusdisNow();

  document.getElementById('blog-grid').style.display = 'none';
  document.getElementById('blog-content').style.display = 'block';
  setTimeout(resizeCusdis, 600);
}


document.getElementById('back-button').addEventListener('click', () => {
document.getElementById('blog-content').style.display = 'none';
document.getElementById('blog-grid').style.display = 'grid';
});
</script>
